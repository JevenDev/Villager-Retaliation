plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev'
    id 'idea'
}

base {
    archivesName = "${rootProject.archives_base_name}-neoforge-${rootProject.minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(rootProject.java_version.toInteger())
    withSourcesJar()
}

sourceSets {
    gameTest {
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
}

configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestCompileOnly.extendsFrom compileOnly
    gameTestRuntimeOnly.extendsFrom runtimeOnly
    gameTestAnnotationProcessor.extendsFrom annotationProcessor
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

def gameTestOriginSeed = providers.gradleProperty('gameTestOriginSeed').orElse('3733')
def campaignScenarioPack = rootProject.file(providers.gradleProperty('campaignScenarioPack').orElse('neoforge/src/gameTest/resources/campaign_fixture').get())
def campaignScenarioReports = layout.buildDirectory.dir("campaign-scenario-reports/${System.currentTimeMillis()}")
def campaignConversationMultiplayerDirectory = layout.buildDirectory.dir("campaign-conversation-multiplayer/${System.currentTimeMillis()}")
def campaignSelectionClientSmokeDirectory = layout.buildDirectory.dir("campaign-selection-client-smoke/${System.currentTimeMillis()}")
def authoringEditorClientSmokeDirectory = layout.buildDirectory.dir("authoring-editor-client-smoke/${System.currentTimeMillis()}")
def animationClientSmokeDirectory = layout.buildDirectory.dir("animation-client-smoke/${System.currentTimeMillis()}")
def pairedGreetClientSmokeDirectory = layout.buildDirectory.dir("paired-greet-client-smoke/${System.currentTimeMillis()}")
def companionClientSmokeDirectory = layout.buildDirectory.dir("companion-client-smoke/${System.currentTimeMillis()}")
def dialogueCameraClientSmokeDirectory = layout.buildDirectory.dir("dialogue-camera-client-smoke/${System.currentTimeMillis()}")
def dialogueCueClientSmokeDirectory = layout.buildDirectory.dir("dialogue-cue-client-smoke/${System.currentTimeMillis()}")

def campaignConversationClientSmokeDirectory = layout.buildDirectory.dir("campaign-conversation-client-smoke/${System.currentTimeMillis()}")

def settlementClientSmokeDirectory = layout.buildDirectory.dir("settlement-client-smoke/${System.currentTimeMillis()}")
def bankStorageClientSmokeDirectory = layout.buildDirectory.dir("bank-storage-client-smoke/${System.currentTimeMillis()}")
def constructionClientSmokeDirectory = layout.buildDirectory.dir("construction-client-smoke/${System.currentTimeMillis()}")
def settlementTownProfileDirectory = layout.buildDirectory.dir("settlement-town-profile/${System.currentTimeMillis()}")
def settlementManyVillageProfileDirectory = layout.buildDirectory.dir("settlement-many-village-profile/${System.currentTimeMillis()}")
def settlementCityAcceptanceDirectory = layout.buildDirectory.dir("settlement-city-acceptance/${System.currentTimeMillis()}")
def diplomacyRestartDirectory = layout.buildDirectory.dir("diplomacy-restart/${System.currentTimeMillis()}")

def settlementMultiplayerDirectory = layout.buildDirectory.dir("settlement-multiplayer/${System.currentTimeMillis()}")

neoForge {
    version = rootProject.neo_version

    parchment {
        mappingsVersion = rootProject.parchment_mappings_version
        minecraftVersion = rootProject.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'villagerretaliation.campaignSourceResources', file('src/main/resources').absolutePath
        }

        campaignSelectionClientSmoke {
            client()
            sourceSet = sourceSets.gameTest
            gameDirectory.set(campaignSelectionClientSmokeDirectory)
            systemProperty 'villagerretaliation.campaignSelectionClientSmoke', campaignSelectionClientSmokeDirectory.get().asFile.absolutePath
            systemProperty 'villagerretaliation.campaignSourceResources', new File(campaignSelectionClientSmokeDirectory.get().asFile, 'campaign-source-resources').absolutePath
            programArguments.addAll '--width', '1280', '--height', '800'
        }

        animationClientSmoke {
            client()
            sourceSet = sourceSets.gameTest
            gameDirectory.set(animationClientSmokeDirectory)
            systemProperty 'villagerretaliation.animationClientSmoke', animationClientSmokeDirectory.get().asFile.absolutePath
            programArguments.addAll '--quickPlaySingleplayer', 'AnimationSmoke', '--width', '1600', '--height', '1000'
        }

        authoringEditorClientSmoke {
            client()
            sourceSet = sourceSets.gameTest
            gameDirectory.set(authoringEditorClientSmokeDirectory)
            systemProperty 'villagerretaliation.authoringEditorClientSmoke', authoringEditorClientSmokeDirectory.get().asFile.absolutePath
            systemProperty 'villagerretaliation.authoringEditorCompletionSmokeOnly', providers.gradleProperty('authoringEditorCompletionSmokeOnly').orElse('false').get()
            systemProperty 'villagerretaliation.authoringEditorPackFolderSmokeOnly', providers.gradleProperty('authoringEditorPackFolderSmokeOnly').orElse('false').get()
            systemProperty 'villagerretaliation.authoringEditorBufferSmokeOnly', providers.gradleProperty('authoringEditorBufferSmokeOnly').orElse('false').get()
            systemProperty 'villagerretaliation.authoringEditorResourceSmokeOnly', providers.gradleProperty('authoringEditorResourceSmokeOnly').orElse('false').get()
            systemProperty 'villagerretaliation.authoringEditorSupportingSmokeOnly', providers.gradleProperty('authoringEditorSupportingSmokeOnly').orElse('false').get()
            systemProperty 'villagerretaliation.authoringEditorSuiteSmokeOnly', providers.gradleProperty('authoringEditorSuiteSmokeOnly').orElse('false').get()
            systemProperty 'villagerretaliation.authoringEditorSceneSmokeOnly', providers.gradleProperty('authoringEditorSceneSmokeOnly').orElse('false').get()
            systemProperty 'villagerretaliation.authoringEditorCampaignSmokeOnly', providers.gradleProperty('authoringEditorCampaignSmokeOnly').orElse('false').get()
            systemProperty 'villagerretaliation.authoringEditorLocalizationSmokeOnly', providers.gradleProperty('authoringEditorLocalizationSmokeOnly').orElse('false').get()
            systemProperty 'villagerretaliation.authoringEditorWorkflowSmokeOnly', providers.gradleProperty('authoringEditorWorkflowSmokeOnly').orElse('false').get()
            systemProperty 'villagerretaliation.authoringEditorPlaytestSmokeOnly', providers.gradleProperty('authoringEditorPlaytestSmokeOnly').orElse('false').get()
            programArguments.addAll '--quickPlaySingleplayer', 'AuthoringEditorSmoke', '--width', '1920', '--height', '1080'
        }

        dialogueCueClientSmoke {
            client()
            sourceSet = sourceSets.gameTest
            gameDirectory.set(dialogueCueClientSmokeDirectory)
            systemProperty 'villagerretaliation.dialogueCueClientSmoke', dialogueCueClientSmokeDirectory.get().asFile.absolutePath
            programArguments.addAll '--quickPlaySingleplayer', 'DialogueCueSmoke', '--width', '1280', '--height', '720'
        }

        dialogueCameraClientSmoke {
            client()
            sourceSet = sourceSets.gameTest
            gameDirectory.set(dialogueCameraClientSmokeDirectory)
            systemProperty 'villagerretaliation.dialogueCameraClientSmoke', dialogueCameraClientSmokeDirectory.get().asFile.absolutePath
            programArguments.addAll '--quickPlaySingleplayer', 'DialogueCameraSmoke', '--width', '1280', '--height', '720'
        }

        pairedGreetClientSmoke {
            client()
            sourceSet = sourceSets.gameTest
            gameDirectory.set(pairedGreetClientSmokeDirectory)
            systemProperty 'villagerretaliation.pairedGreetClientSmoke', pairedGreetClientSmokeDirectory.get().asFile.absolutePath
            programArguments.addAll '--quickPlaySingleplayer', 'PairedGreetSmoke', '--width', '1280', '--height', '720'
        }

        companionClientSmoke {
            client()
            sourceSet = sourceSets.gameTest
            gameDirectory.set(companionClientSmokeDirectory)
            systemProperty 'villagerretaliation.companionClientSmoke', companionClientSmokeDirectory.get().asFile.absolutePath
            programArguments.addAll '--quickPlaySingleplayer', 'CompanionSmoke', '--width', '1280', '--height', '720'
        }

        campaignConversationClientSmoke {
            client()
            sourceSet = sourceSets.gameTest
            gameDirectory.set(campaignConversationClientSmokeDirectory)
            systemProperty 'villagerretaliation.campaignConversationClientSmoke', campaignConversationClientSmokeDirectory.get().asFile.absolutePath
            programArguments.addAll '--quickPlaySingleplayer', 'CampaignConversationSmoke', '--width', '1280', '--height', '720'
        }

        campaignConversationMultiplayerHost {
            client()
            sourceSet = sourceSets.gameTest
            gameDirectory.set(campaignConversationMultiplayerDirectory.map { it.dir('host') })
            systemProperty 'villagerretaliation.campaignConversationMultiplayer', campaignConversationMultiplayerDirectory.get().asFile.absolutePath
            systemProperty 'villagerretaliation.campaignConversationMultiplayer.role', 'host'
            systemProperty 'villagerretaliation.campaignConversationMultiplayer.args', layout.buildDirectory.dir('moddev').get().asFile.absolutePath
            programArguments.addAll '--quickPlaySingleplayer', 'CampaignMultiplayer', '--username', 'CampaignHost', '--width', '1280', '--height', '720'
        }

        campaignConversationMultiplayerPeer {
            client()
            sourceSet = sourceSets.gameTest
            gameDirectory.set(campaignConversationMultiplayerDirectory.map { it.dir('peer') })
            systemProperty 'villagerretaliation.campaignConversationMultiplayer', campaignConversationMultiplayerDirectory.get().asFile.absolutePath
            systemProperty 'villagerretaliation.campaignConversationMultiplayer.role', 'peer'
            programArguments.addAll '--username', 'CampaignPeer', '--width', '1280', '--height', '720'
        }

        settlementClientSmoke {
            client()
            sourceSet = sourceSets.gameTest
            gameDirectory.set(settlementClientSmokeDirectory)
            systemProperty 'villagerretaliation.settlementClientSmoke', settlementClientSmokeDirectory.get().asFile.absolutePath
            programArguments.addAll '--quickPlaySingleplayer', 'SettlementViewSmoke', '--width', '1280', '--height', '720'
        }

        bankStorageClientSmoke {
            client()
            sourceSet = sourceSets.gameTest
            gameDirectory.set(bankStorageClientSmokeDirectory)
            systemProperty 'villagerretaliation.bankStorageClientSmoke', bankStorageClientSmokeDirectory.get().asFile.absolutePath
            programArguments.addAll '--quickPlaySingleplayer', 'BankStorageSmoke', '--width', '1280', '--height', '720'
        }

        constructionClientSmoke {
            client()
            sourceSet = sourceSets.gameTest
            gameDirectory.set(constructionClientSmokeDirectory)
            systemProperty 'villagerretaliation.constructionClientSmoke', constructionClientSmokeDirectory.get().asFile.absolutePath
            programArguments.addAll '--quickPlaySingleplayer', 'ConstructionSmoke', '--width', '1280', '--height', '720'
        }

        settlementTownProfile {
            client()
            sourceSet = sourceSets.gameTest
            gameDirectory.set(settlementTownProfileDirectory)
            systemProperty 'villagerretaliation.settlementTownProfile', settlementTownProfileDirectory.get().asFile.absolutePath
            programArguments.addAll '--quickPlaySingleplayer', 'SettlementTownProfile', '--width', '1280', '--height', '720'
        }

        settlementManyVillageProfile {
            client()
            sourceSet = sourceSets.gameTest
            gameDirectory.set(settlementManyVillageProfileDirectory)
            systemProperty 'villagerretaliation.settlementManyVillageProfile', settlementManyVillageProfileDirectory.get().asFile.absolutePath
            programArguments.addAll '--quickPlaySingleplayer', 'SettlementManyVillageProfile', '--width', '1280', '--height', '720'
        }

        settlementCityAcceptance {
            client()
            sourceSet = sourceSets.gameTest
            gameDirectory.set(settlementCityAcceptanceDirectory)
            systemProperty 'villagerretaliation.settlementCityAcceptance', settlementCityAcceptanceDirectory.get().asFile.absolutePath
            programArguments.addAll '--quickPlaySingleplayer', 'SettlementCityAcceptance', '--width', '1280', '--height', '720'
        }

        settlementMultiplayerHost {
            client()
            sourceSet = sourceSets.gameTest
            gameDirectory.set(settlementMultiplayerDirectory.map { it.dir('host') })
            systemProperty 'villagerretaliation.settlementMultiplayer', settlementMultiplayerDirectory.get().asFile.absolutePath
            systemProperty 'villagerretaliation.settlementMultiplayer.role', 'host'
            systemProperty 'villagerretaliation.settlementMultiplayer.args', layout.buildDirectory.dir('moddev').get().asFile.absolutePath
            programArguments.addAll '--quickPlaySingleplayer', 'SettlementMultiplayer', '--username', 'SettlementHost', '--width', '1280', '--height', '720'
        }

        settlementMultiplayerPeer {
            client()
            sourceSet = sourceSets.gameTest
            gameDirectory.set(settlementMultiplayerDirectory.map { it.dir('peer') })
            systemProperty 'villagerretaliation.settlementMultiplayer', settlementMultiplayerDirectory.get().asFile.absolutePath
            systemProperty 'villagerretaliation.settlementMultiplayer.role', 'peer'
            programArguments.addAll '--username', 'SettlementPeer', '--width', '1280', '--height', '720'
        }

        server {
            server()
            programArgument '--nogui'
        }

        campaignScenarioServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            gameDirectory.set(layout.buildDirectory.dir('campaign-scenario-run'))
            systemProperty 'neoforge.enabledGameTestNamespaces', 'campaign_scenarios'
            systemProperty 'villagerretaliation.gametestOriginSeed', gameTestOriginSeed.get()
            systemProperty 'villagerretaliation.gameteststructures', file('src/main/gameteststructures').absolutePath
            systemProperty 'villagerretaliation.campaignScenarioPack', campaignScenarioPack.absolutePath
            systemProperty 'villagerretaliation.campaignScenario', providers.gradleProperty('campaignScenario').orElse('').get()
            systemProperty 'villagerretaliation.campaignScenarioRepeats', providers.gradleProperty('campaignScenarioRepeats').orElse('2').get()
            systemProperty 'villagerretaliation.campaignScenarioReports', campaignScenarioReports.get().asFile.absolutePath
        }

        (1..4).each { phase ->
            register("diplomacyRestart${phase}") {
                client()
                sourceSet = sourceSets.gameTest
                gameDirectory.set(diplomacyRestartDirectory)
                systemProperty 'villagerretaliation.diplomacyRestart', diplomacyRestartDirectory.get().asFile.absolutePath
                systemProperty 'villagerretaliation.diplomacyRestartPhase', phase.toString()
                programArguments.addAll '--quickPlaySingleplayer', 'DiplomacyRestart', '--username', 'RestartHost', '--width', '960', '--height', '640'
            }
        }

        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            gameDirectory.set(layout.buildDirectory.dir('gametest-run'))
            systemProperty 'villagerretaliation.gametestOriginSeed', gameTestOriginSeed.get()
            systemProperty 'neoforge.enabledGameTestNamespaces', providers.gradleProperty('gameTestNamespaces').orElse('').get()
            systemProperty 'villagerretaliation.campaignScenarioPack', campaignScenarioPack.absolutePath
            systemProperty 'villagerretaliation.campaignScenario', providers.gradleProperty('campaignScenario').orElse('').get()
            systemProperty 'villagerretaliation.campaignScenarioRepeats', providers.gradleProperty('campaignScenarioRepeats').orElse('1').get()
            systemProperty 'villagerretaliation.campaignScenarioReports', campaignScenarioReports.get().asFile.absolutePath
            systemProperty 'villagerretaliation.settlementLoadProfile', providers.gradleProperty('settlementLoadProfile').orElse('0').get()
            systemProperty 'villagerretaliation.settlementLoadProfilePaced', providers.gradleProperty('settlementLoadProfilePaced').orElse('false').get()
            systemProperty 'villagerretaliation.settlementLoadProfileRequire20Tps', providers.gradleProperty('settlementLoadProfileRequire20Tps').orElse('false').get()
            systemProperty 'villagerretaliation.settlementLoadProfileOutput', providers.gradleProperty('settlementLoadProfileOutput').orElse('settlement-load-profile').get()
            systemProperty 'villagerretaliation.villageLifeProfile', providers.gradleProperty('villageLifeProfile').orElse('false').get()
            systemProperty 'villagerretaliation.diplomacyProfile', providers.gradleProperty('diplomacyProfile').orElse('0').get()
            systemProperty 'villagerretaliation.diplomacyProfileOutput', providers.gradleProperty('diplomacyProfileOutput').orElse('diplomacy-profile').get()
            systemProperty 'villagerretaliation.gameteststructures', file('src/main/gameteststructures').absolutePath
        }

        data {
            data()
            programArguments.addAll '--mod', rootProject.mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${rootProject.mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gameTest)
        }
    }

    addModdingDependenciesTo sourceSets.gameTest
}

tasks.named('runAuthoringEditorClientSmoke') {
    dependsOn tasks.named('runGameTestServer')
    doFirst {
        def metadata = layout.buildDirectory.file('gametest-run/world/level.dat').get().asFile
        if (!metadata.isFile()) throw new GradleException('Editor client checks require generated GameTest world metadata.')
        copy {
            from metadata
            into new File(authoringEditorClientSmokeDirectory.get().asFile, 'saves/AuthoringEditorSmoke')
        }
        def imgui = configurations.compileClasspath.find { it.name.startsWith('imguimc-') }
        if (imgui == null) throw new GradleException('Editor client checks require the declared ImGuiMC dependency.')
        copy {
            from imgui
            into new File(authoringEditorClientSmokeDirectory.get().asFile, 'mods')
        }
        new File(authoringEditorClientSmokeDirectory.get().asFile, 'options.txt').text =
                'onboardAccessibility:false\npauseOnLostFocus:false\nsoundCategory_master:0.0\ntutorialStep:none\nrenderDistance:3\nsimulationDistance:3\nguiScale:2\n'
    }
    doLast {
        def result = new File(authoringEditorClientSmokeDirectory.get().asFile, 'result.txt')
        if (!result.isFile() || !result.text.contains('Authoring editor client smoke passed'))
            throw new GradleException("Editor client checks did not finish. Inspect ${authoringEditorClientSmokeDirectory.get().asFile}")
    }
}

tasks.named('runDialogueCameraClientSmoke') {
    dependsOn tasks.named('runGameTestServer')
    doFirst {
        def metadata = layout.buildDirectory.file('gametest-run/world/level.dat').get().asFile
        if (!metadata.isFile()) throw new GradleException('Dialogue camera checks require generated GameTest world metadata.')
        copy {
            from metadata
            into new File(dialogueCameraClientSmokeDirectory.get().asFile, 'saves/DialogueCameraSmoke')
        }
        def modsDirectory = providers.gradleProperty('dialogueCameraClientSmokeModsDirectory').orNull
        if (modsDirectory != null) {
            def sourceDirectory = rootProject.file(modsDirectory)
            if (!sourceDirectory.isDirectory()) throw new GradleException("Camera smoke mods directory does not exist: ${sourceDirectory}")
            copy {
                from sourceDirectory
                include '*.jar'
                into new File(dialogueCameraClientSmokeDirectory.get().asFile, 'mods')
            }
        }
        new File(dialogueCameraClientSmokeDirectory.get().asFile, 'options.txt').text =
                'onboardAccessibility:false\npauseOnLostFocus:false\nsoundCategory_master:0.0\ntutorialStep:none\nrenderDistance:3\nsimulationDistance:3\n'
    }
    doLast {
        def result = new File(dialogueCameraClientSmokeDirectory.get().asFile, 'result.txt')
        if (!result.isFile() || !result.text.contains('Dialogue camera client smoke passed'))
            throw new GradleException("Dialogue camera client checks did not finish. Inspect ${dialogueCameraClientSmokeDirectory.get().asFile}")
    }
}

