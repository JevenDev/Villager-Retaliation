tasks.named('runSettlementCityAcceptance') {
    dependsOn tasks.named('runGameTestServer')
    doFirst {
        def metadata = layout.buildDirectory.file('gametest-run/world/level.dat').get().asFile
        if (!metadata.isFile()) {
            throw new GradleException('Settlement City acceptance requires the generated GameTest world metadata.')
        }
        copy {
            from metadata
            into new File(settlementCityAcceptanceDirectory.get().asFile, 'saves/SettlementCityAcceptance')
        }
        new File(settlementCityAcceptanceDirectory.get().asFile, 'options.txt').text =
                'onboardAccessibility:false\npauseOnLostFocus:false\nsoundCategory_master:0.0\ntutorialStep:none\n'
    }
    doLast {
        def result = new File(settlementCityAcceptanceDirectory.get().asFile, 'result.txt')
        if (!result.isFile() || !result.text.contains('Settlement City acceptance passed')) {
