tasks.register('campaignScenarios') {
    group = 'verification'
    description = 'Replays authored campaign scenarios in an isolated GameTest world. Supports campaignScenarioPack, campaignScenario, and campaignScenarioRepeats.'
    dependsOn tasks.named('runCampaignScenarioServer')
    doLast {
        def selection = providers.gradleProperty('campaignScenario').orElse('').get()
        def repeats = providers.gradleProperty('campaignScenarioRepeats').orElse('2').get().toInteger()
        def json = new groovy.json.JsonSlurper()
        def scenarios = fileTree(campaignScenarioPack) { include 'data/*/campaign_scenarios/**/*.json' }.files
                .collect { json.parse(it).id }.findAll { selection.isBlank() || it == selection }
        def reports = fileTree(campaignScenarioReports) { include '**/*.json' }.files.collect { json.parse(it) }
        if (scenarios.isEmpty() || reports.size() != scenarios.size() * repeats || reports.any { it.passed != true }
                || scenarios.any { id -> (1..repeats).any { repetition ->
                    reports.count { it.scenario == id && it.repetition == repetition } != 1
                } }) {
            throw new GradleException("Campaign scenarios did not all pass. Inspect ${campaignScenarioReports.get().asFile}")
        }
    }
}

// A running Windows dev client keeps the generated NeoForge jar open. When
// IntelliJ refreshes Gradle after an AT/version change, NeoForm cannot replace
// that jar. Stop only Java processes that Windows confirms hold these outputs.
tasks.named('createMinecraftArtifacts') {
    doFirst {
        if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
            def artifactDirectory = layout.buildDirectory.dir('moddev/artifacts').get().asFile
            def unlockScript = rootProject.file('gradle/windows-unlock-moddev-artifacts.ps1')
            def unlockProcess = new ProcessBuilder(
                    'powershell.exe',
                    '-NoProfile',
                    '-NonInteractive',
                    '-ExecutionPolicy', 'Bypass',
                    '-File', unlockScript.absolutePath,
                    '-ArtifactDirectory', artifactDirectory.absolutePath)
                    .inheritIO()
                    .start()

            def exitCode = unlockProcess.waitFor()
            if (exitCode != 0) {
                throw new GradleException(
                        "Could not release locked ModDevGradle artifacts (PowerShell exit code ${exitCode}).")
            }
        }
    }
}

