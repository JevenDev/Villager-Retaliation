def configureIsolatedClientSmoke = { String taskName, runDirectory, String worldName,
                                     String options, String expectedMarker, String failureMessage ->
    tasks.named(taskName) {
        doFirst {
            def metadata = layout.buildDirectory.file('gametest-run/world/level.dat').get().asFile
            if (!metadata.isFile()) throw new GradleException('Run focused GameTests first to create isolated world metadata.')
            copy {
                from metadata
                into new File(runDirectory.get().asFile, "saves/${worldName}")
            }
            new File(runDirectory.get().asFile, 'options.txt').text = options
        }
        doLast {
            def result = new File(runDirectory.get().asFile, 'result.txt')
            if (!result.isFile() || !result.text.contains(expectedMarker))
                throw new GradleException(failureMessage + ' Inspect ' + runDirectory.get().asFile)
        }
    }
}

