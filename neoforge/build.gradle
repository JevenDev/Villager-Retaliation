plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev'
    id 'idea'
}

base {
    archivesName = "${rootProject.archives_base_name}-neoforge-${rootProject.minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(rootProject.java_version.toInteger())
    withSourcesJar()
}

sourceSets {
    gameTest {
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
}

configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestCompileOnly.extendsFrom compileOnly
    gameTestRuntimeOnly.extendsFrom runtimeOnly
    gameTestAnnotationProcessor.extendsFrom annotationProcessor
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

def gameTestOriginSeed = providers.gradleProperty('gameTestOriginSeed').orElse('3733')
def settlementClientSmokeDirectory = layout.buildDirectory.dir("settlement-client-smoke/${System.currentTimeMillis()}")
def settlementTownProfileDirectory = layout.buildDirectory.dir("settlement-town-profile/${System.currentTimeMillis()}")
def settlementManyVillageProfileDirectory = layout.buildDirectory.dir("settlement-many-village-profile/${System.currentTimeMillis()}")
def settlementCityAcceptanceDirectory = layout.buildDirectory.dir("settlement-city-acceptance/${System.currentTimeMillis()}")
def settlementMultiplayerDirectory = layout.buildDirectory.dir("settlement-multiplayer/${System.currentTimeMillis()}")

neoForge {
    version = rootProject.neo_version

    parchment {
        mappingsVersion = rootProject.parchment_mappings_version
        minecraftVersion = rootProject.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }

        settlementClientSmoke {
            client()
            sourceSet = sourceSets.gameTest
            gameDirectory.set(settlementClientSmokeDirectory)
            systemProperty 'villagerretaliation.settlementClientSmoke', settlementClientSmokeDirectory.get().asFile.absolutePath
            programArguments.addAll '--quickPlaySingleplayer', 'SettlementViewSmoke', '--width', '1280', '--height', '720'
        }

        settlementTownProfile {
            client()
            sourceSet = sourceSets.gameTest
            gameDirectory.set(settlementTownProfileDirectory)
            systemProperty 'villagerretaliation.settlementTownProfile', settlementTownProfileDirectory.get().asFile.absolutePath
            programArguments.addAll '--quickPlaySingleplayer', 'SettlementTownProfile', '--width', '1280', '--height', '720'
        }

        settlementManyVillageProfile {
            client()
            sourceSet = sourceSets.gameTest
            gameDirectory.set(settlementManyVillageProfileDirectory)
            systemProperty 'villagerretaliation.settlementManyVillageProfile', settlementManyVillageProfileDirectory.get().asFile.absolutePath
            programArguments.addAll '--quickPlaySingleplayer', 'SettlementManyVillageProfile', '--width', '1280', '--height', '720'
        }

        settlementCityAcceptance {
            client()
            sourceSet = sourceSets.gameTest
            gameDirectory.set(settlementCityAcceptanceDirectory)
            systemProperty 'villagerretaliation.settlementCityAcceptance', settlementCityAcceptanceDirectory.get().asFile.absolutePath
            programArguments.addAll '--quickPlaySingleplayer', 'SettlementCityAcceptance', '--width', '1280', '--height', '720'
        }

        settlementMultiplayerHost {
            client()
            sourceSet = sourceSets.gameTest
            gameDirectory.set(settlementMultiplayerDirectory.map { it.dir('host') })
            systemProperty 'villagerretaliation.settlementMultiplayer', settlementMultiplayerDirectory.get().asFile.absolutePath
            systemProperty 'villagerretaliation.settlementMultiplayer.role', 'host'
            systemProperty 'villagerretaliation.settlementMultiplayer.args', layout.buildDirectory.dir('moddev').get().asFile.absolutePath
            programArguments.addAll '--quickPlaySingleplayer', 'SettlementMultiplayer', '--username', 'SettlementHost', '--width', '1280', '--height', '720'
        }

        settlementMultiplayerPeer {
            client()
            sourceSet = sourceSets.gameTest
            gameDirectory.set(settlementMultiplayerDirectory.map { it.dir('peer') })
            systemProperty 'villagerretaliation.settlementMultiplayer', settlementMultiplayerDirectory.get().asFile.absolutePath
            systemProperty 'villagerretaliation.settlementMultiplayer.role', 'peer'
            programArguments.addAll '--username', 'SettlementPeer', '--width', '1280', '--height', '720'
        }

        server {
            server()
            programArgument '--nogui'
        }

        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            gameDirectory.set(layout.buildDirectory.dir('gametest-run'))
            systemProperty 'villagerretaliation.gametestOriginSeed', gameTestOriginSeed.get()
            systemProperty 'villagerretaliation.gameteststructures', file('src/main/gameteststructures').absolutePath
        }

        data {
            data()
            programArguments.addAll '--mod', rootProject.mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${rootProject.mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gameTest)
        }
    }

    addModdingDependenciesTo sourceSets.gameTest
}

tasks.named('runSettlementClientSmoke') {
    dependsOn tasks.named('runGameTestServer')
    doFirst {
        def metadata = layout.buildDirectory.file('gametest-run/world/level.dat').get().asFile
        if (!metadata.isFile()) {
            throw new GradleException('Settlement client checks require the generated GameTest world metadata.')
        }
        copy {
            from metadata
            into new File(settlementClientSmokeDirectory.get().asFile, 'saves/SettlementViewSmoke')
        }
        def modsDirectory = providers.gradleProperty('settlementClientSmokeModsDirectory').orNull
        if (modsDirectory != null) {
            def mods = file(modsDirectory)
            if (!mods.isDirectory()) {
                throw new GradleException("Settlement client smoke mods directory does not exist: ${mods}")
            }
            copy {
                from mods
                include '*.jar'
                into new File(settlementClientSmokeDirectory.get().asFile, 'mods')
            }
        }
        new File(settlementClientSmokeDirectory.get().asFile, 'options.txt').text =
                'onboardAccessibility:false\npauseOnLostFocus:false\nsoundCategory_master:0.0\n'
    }
    doLast {
        def result = new File(settlementClientSmokeDirectory.get().asFile, 'result.txt')
        if (!result.isFile() || !result.text.contains('Settlement client smoke checks passed')) {
            throw new GradleException("Settlement client checks did not finish. Inspect ${settlementClientSmokeDirectory.get().asFile}")
        }
    }
}

