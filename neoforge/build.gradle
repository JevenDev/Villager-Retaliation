tasks.named('runCampaignConversationMultiplayerHost') {
    dependsOn tasks.named('runGameTestServer'), tasks.named('prepareCampaignConversationMultiplayerPeerRun')
    doFirst {
        def metadata = layout.buildDirectory.file('gametest-run/world/level.dat').get().asFile
        if (!metadata.isFile()) throw new GradleException('Campaign multiplayer checks require generated GameTest world metadata.')
        def output = campaignConversationMultiplayerDirectory.get().asFile
        copy {
            from metadata
            into new File(output, 'host/saves/CampaignMultiplayer')
        }
        ['host', 'peer'].each { role ->
            def directory = new File(output, role)
            directory.mkdirs()
            new File(directory, 'options.txt').text =
                    'onboardAccessibility:false\npauseOnLostFocus:false\nsoundCategory_master:0.0\ntutorialStep:none\n'
        }
    }
    doLast {
        def result = new File(campaignConversationMultiplayerDirectory.get().asFile, 'result.txt')
        if (!result.isFile() || !result.text.contains('Campaign conversation multiplayer acceptance passed')) {
            throw new GradleException("Campaign multiplayer checks did not finish. Inspect ${campaignConversationMultiplayerDirectory.get().asFile}")
        }
    }
}

