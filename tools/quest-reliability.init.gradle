// Opt-in headless runner; keeps the shared mod build configuration unchanged.
gradle.projectsEvaluated {
    def mod = gradle.rootProject.project(':neoforge')
    mod.tasks.register('verifyQuestReliability', JavaExec) {
        group = 'verification'
        description = 'Runs detached quest lifecycle and native NBT persistence checks without a server or client.'
        dependsOn mod.tasks.named('gameTestClasses')
        classpath = mod.sourceSets.gameTest.runtimeClasspath
        mainClass = 'com.jvn.villagerretaliation.quest.QuestReliabilityChecks'
    }
}
