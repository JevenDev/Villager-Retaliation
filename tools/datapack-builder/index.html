<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Villager Retaliation Datapack Builder</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="brand">
          <img src="./assets/villager_retaliation_logo.png" alt="Villager Retaliation logo">
          <div>
            <p class="eyebrow">Villager Retaliation</p>
            <h1>Datapack Creator</h1>
          </div>
        </div>
        <div class="toolbar" aria-label="Datapack actions">
          <label class="button button-secondary" for="import-input" title="Import a datapack zip or JSON files">
            <span class="button-icon import-icon" aria-hidden="true"></span>
            Import
          </label>
          <label class="button button-secondary" for="directory-input" title="Import an unpacked datapack folder">
            <span class="button-icon folder-icon" aria-hidden="true"></span>
            Folder
          </label>
          <button class="button button-secondary" id="starter-button" type="button" title="Load a small working example">
            <span class="button-icon spark-icon" aria-hidden="true"></span>
            Starter
          </button>
          <button class="button button-primary" id="export-button" type="button" title="Export a datapack zip">
            <span class="button-icon export-icon" aria-hidden="true"></span>
            Export
          </button>
        </div>
      </header>

      <main class="workspace">
        <aside class="left-rail" aria-label="Creator navigation">
          <div class="rail-chrome">
            <button class="rail-toggle rail-toggle-left is-on" id="left-panel-toggle-button" type="button" aria-pressed="true" aria-label="Hide left panel">
              &lt;
            </button>
          </div>
          <section class="panel workflow-panel">
            <div class="panel-title">
              <div>
                <p class="eyebrow">Workflow</p>
                <h2>Build Steps</h2>
              </div>
            </div>
            <nav class="section-tabs" id="section-tabs" aria-label="Builder sections">
              <button class="tab is-active has-tooltip" type="button" data-section="overview" data-tooltip="Set the datapack metadata, namespace, file slug, and locale.">
                <span class="step-index" aria-hidden="true">01</span>
                <span class="tab-copy">
                  <span class="tab-label">Pack</span>
                  <span class="tab-detail">Metadata and paths</span>
                </span>
                <span class="tab-count" aria-label="Pack status">Setup</span>
              </button>
              <button class="tab has-tooltip" type="button" data-section="dialogue" data-tooltip="Create talk options, villager lines, keyed messages, openings, closings, and pacify responses.">
                <span class="step-index" aria-hidden="true">02</span>
                <span class="tab-copy">
                  <span class="tab-label">Dialogue</span>
                  <span class="tab-detail">Talk options and lines</span>
                </span>
                <span class="tab-count" aria-label="Dialogue entry count">0</span>
              </button>
              <button class="tab has-tooltip" type="button" data-section="notifications" data-tooltip="Create HUD notifications and ambient world text entries.">
                <span class="step-index" aria-hidden="true">03</span>
                <span class="tab-copy">
                  <span class="tab-label">Notifications</span>
                  <span class="tab-detail">HUD and world text</span>
                </span>
                <span class="tab-count" aria-label="Notification entry count">0</span>
              </button>
              <button class="tab has-tooltip" type="button" data-section="gifts" data-tooltip="Define gift reactions, custom response keys, and high-reputation reward items.">
                <span class="step-index" aria-hidden="true">04</span>
                <span class="tab-copy">
                  <span class="tab-label">Gifts</span>
                  <span class="tab-detail">Reactions and rewards</span>
                </span>
                <span class="tab-count" aria-label="Gift entry count">0</span>
              </button>
              <button class="tab has-tooltip" type="button" data-section="pacification" data-tooltip="Define held-item payments that can calm hostile villagers or wandering traders.">
                <span class="step-index" aria-hidden="true">05</span>
                <span class="tab-copy">
                  <span class="tab-label">Pacification</span>
                  <span class="tab-detail">Peace payments</span>
                </span>
                <span class="tab-count" aria-label="Pacification entry count">0</span>
              </button>
              <button class="tab has-tooltip" type="button" data-section="stories" data-tooltip="Define structures and biomes that unlock share-story dialogue.">
                <span class="step-index" aria-hidden="true">06</span>
                <span class="tab-copy">
                  <span class="tab-label">Stories</span>
                  <span class="tab-detail">Structures and biomes</span>
                </span>
                <span class="tab-count" aria-label="Story entry count">0</span>
              </button>
              <button class="tab has-tooltip" type="button" data-section="names" data-tooltip="Replace or extend preset villager name pools.">
                <span class="step-index" aria-hidden="true">07</span>
                <span class="tab-copy">
                  <span class="tab-label">Names</span>
                  <span class="tab-detail">Preset name pools</span>
                </span>
                <span class="tab-count" aria-label="Name count">0</span>
              </button>
            </nav>
          </section>

          <section class="panel files-panel">
            <div class="panel-title">
              <div>
                <p class="eyebrow">Output</p>
                <h2>Generated Files</h2>
              </div>
              <span id="file-count">0</span>
            </div>
            <div id="file-tree" class="file-tree"></div>
          </section>
        </aside>

        <section class="builder" aria-label="Datapack builder">
          <div id="builder-panel" class="builder-panel"></div>
        </section>

        <aside class="right-rail" aria-label="Validation and preview">
          <div class="rail-chrome">
            <button class="rail-toggle rail-toggle-right is-on" id="right-panel-toggle-button" type="button" aria-pressed="true" aria-label="Hide right panel">
              &gt;
            </button>
          </div>
          <section class="panel checks-panel">
            <div class="panel-title">
              <div>
                <p class="eyebrow">Status</p>
                <h2>Checks</h2>
              </div>
              <span id="check-count">0</span>
            </div>
            <div id="checks" class="checks"></div>
          </section>

          <section class="preview" aria-label="Generated JSON preview">
            <div class="preview-header">
              <div>
                <p class="eyebrow">Preview</p>
                <h2 id="selected-path">pack.mcmeta</h2>
              </div>
              <div class="preview-actions">
                <button class="icon-button" id="copy-file-button" type="button" title="Copy current file">
                  <span class="button-icon copy-icon" aria-hidden="true"></span>
                </button>
                <button class="icon-button" id="download-file-button" type="button" title="Download current file">
                  <span class="button-icon download-icon" aria-hidden="true"></span>
                </button>
              </div>
            </div>
            <pre class="code-preview"><code id="json-preview"></code></pre>
          </section>
        </aside>
      </main>
    </div>

    <input id="import-input" class="visually-hidden" type="file" accept=".zip,.json,application/json,application/zip" multiple>
    <input id="directory-input" class="visually-hidden" type="file" webkitdirectory directory multiple>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="./app.js"></script>
  </body>
</html>
