gradle.projectsEvaluated {
    def mod = gradle.rootProject.project(':neoforge')
    mod.tasks.register('verifyInteractionFlows', JavaExec) {
        group = 'verification'
        description = 'Checks interaction flow state, actions, and payloads without launching a client.'
        dependsOn mod.tasks.named('gameTestClasses')
        classpath = mod.sourceSets.gameTest.runtimeClasspath
        mainClass = 'com.jvn.villagerretaliation.client.interaction.InteractionFlowChecks'
    }
}
