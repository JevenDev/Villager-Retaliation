name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Validate data and tools
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: verify-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Generate wiki data
        run: |
          node wiki/player/build-data.mjs
          node wiki/dev/build-data.mjs
      - name: Validate data and tools
        run: node tools/verify.mjs
      - name: Build combined Pages artifact
        run: |
          mkdir -p _site/developer-wiki
          mkdir -p _site/shared
          cp -R wiki/player/. _site/
          cp -R wiki/dev/. _site/developer-wiki/
          cp -R wiki/shared/. _site/shared/
          touch _site/.nojekyll
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build --no-daemon

  deploy:
    name: Deploy Wiki Sites
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
