name: Deploy Wiki Sites

on:
  push:
    branches: ["1.21.1"]
    paths:
      - "tools/datapack-builder/**"
      - "tools/player-wiki/**"
      - ".github/workflows/deploy-pages.yml"
  pull_request:
    branches: ["1.21.1"]
    paths:
      - "tools/datapack-builder/**"
      - "tools/player-wiki/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate static sites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: node --check tools/datapack-builder/app.js

      - name: Check player wiki JavaScript syntax
        run: node --check tools/player-wiki/app.js

      - name: Verify datapack builder entry files
        run: |
          test -f tools/datapack-builder/index.html
          test -f tools/datapack-builder/styles.css
          test -f tools/datapack-builder/app.js

      - name: Verify player wiki entry files
        run: |
          test -f tools/player-wiki/index.html
          test -f tools/player-wiki/styles.css
          test -f tools/player-wiki/app.js
          test -f tools/player-wiki/site-data.js

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build combined Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site/datapack-builder
          cp -R tools/player-wiki/. _site/
          cp -R tools/datapack-builder/. _site/datapack-builder/
          touch _site/.nojekyll

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
