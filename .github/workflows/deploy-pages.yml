name: Deploy Wiki Sites

on:
  push:
    branches: ["1.21.1"]
    paths:
      - "tools/datapack-builder/**"
      - "tools/quest-builder/**"
      - "tools/test-quest-builder-*.mjs"
      - "tools/verify.mjs"
      - "wiki/**"
      - "example-packs/**"
      - ".github/workflows/deploy-pages.yml"
  pull_request:
    branches: ["1.21.1"]
    paths:
      - "tools/datapack-builder/**"
      - "tools/quest-builder/**"
      - "tools/test-quest-builder-*.mjs"
      - "tools/verify.mjs"
      - "wiki/**"
      - "example-packs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate static sites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate repository tools and sites
        run: node tools/verify.mjs

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build combined Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site/datapack-builder
          mkdir -p _site/quest-builder
          mkdir -p _site/developer-wiki
          mkdir -p _site/shared
          cp -R wiki/player/. _site/
          cp -R tools/datapack-builder/. _site/datapack-builder/
          cp -R tools/quest-builder/. _site/quest-builder/
          cp -R wiki/dev/. _site/developer-wiki/
          cp -R wiki/shared/. _site/shared/
          touch _site/.nojekyll

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
